name: Stock Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # 每5分鐘
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Run bot
        run: python stock_bot.py
